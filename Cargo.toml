[package]
name = "todo-app-gpui"
version = "0.1.0"
edition = "2021"

# 1. Add the authors field to fix the Error[4]
authors = ["Your Name <your.email@example.com>"]

# 2. Add a license to clear the EULA warning (or choose MIT, GPL-3.0, etc.)
license = "Apache-2.0"

# (Optional) You can also add a description which looks great on installers
description = "A simple Todo and Notes application built with GPUI"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
winresource = "0.1"


# A debug launch spends most of its time inside unoptimized GPUI. Optimize dependencies
# only, so `cargo run` opens faster without a full release build. The next run recompiles
# those dependencies once.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.todo-app-gpui]
opt-level = 0

[profile.release]
opt-level = 3          # Maximize speed optimizations
lto = true             # Enable Link-Time Optimization across crates
codegen-units = 1      # Reduce parallel codegen units to improve optimizations
strip = true           # Automatically strip symbols and debuginfo from binary
panic = "abort"        # Removes panic string formatting code (optional)



